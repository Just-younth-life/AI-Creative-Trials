<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宽序｜AI社交日程管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        primary: '#6366f1',
        secondary: '#f472b6',
      },
      animation: {
        'upgrade': 'upgrade 1s ease-out',
        'achievement': 'achievement 1.2s ease-out',
      },
      keyframes: {
        upgrade: {
          '0%': { transform: 'scale(1)', opacity: '1' },
          '50%': { transform: 'scale(1.2)', opacity: '0.8' },
          '100%': { transform: 'scale(1)', opacity: '1' },
        },
        achievement: {
          '0%': { transform: 'translateY(30px)', opacity: 0 },
          '20%': { transform: 'translateY(0)', opacity: 1 },
          '80%': { transform: 'translateY(0)', opacity: 1 },
          '100%': { transform: 'translateY(-20px)', opacity: 0 },
        }
      }
    }
  }
}
</script>
<style>
* {box-sizing: border-box;}
.calendar-day {min-height:80px;}
.modal-backdrop {position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;display:flex;align-items:center;justify-content:center;}
.modal-box {width:90%;max-width:600px;background:white;dark:bg-gray-800;border-radius:16px;padding:24px;position:relative;max-height:85vh;overflow:auto;}
.dark .modal-box {background:#1f2937;color:#eee;}
.achievement-toast {position:fixed;top:20px;right:20px;z-index:100;animation:achievement 1.2s forwards;}
.upgrade-flash {animation:upgrade 1s;}
.职业-card {transition:0.2s;cursor:pointer;}
.职业-card:hover {transform: translateY(-4px);box-shadow:0 8px 16px #00000022;}
</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
<div id="app" class="flex h-screen overflow-hidden">
  <!-- 左侧侧边栏 -->
  <aside class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col p-4">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-xl font-bold text-primary">宽序</h1>
      <button id="toggleDark" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fa fa-moon-o"></i></button>
    </div>
    <nav class="flex-1 space-y-2">
      <button data-view="task" class="view-btn w-full text-left p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fa fa-list-ul mr-2"></i>任务清单</button>
      <button data-view="calendar" class="view-btn w-full text-left p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fa fa-calendar mr-2"></i>日历视图</button>
      <button data-view="publicGoal" class="view-btn w-full text-left p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fa fa-bullhorn mr-2"></i>公开目标</button>
      <button data-view="rank" class="view-btn w-full text-left p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fa fa-trophy mr-2"></i>赛道排行榜</button>
      <button id="gameToggle" class="w-full text-left p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 border border-dashed border-primary mt-6"><i class="fa fa-gamepad mr-2 text-primary"></i>游戏化人生管理</button>
    </nav>
    <div class="text-xs text-gray-400 mt-4">凌霄AI助手 · 360梯度职业系统</div>
  </aside>

  <!-- 主内容区 -->
  <main class="flex-1 overflow-auto p-6">
    <!-- 任务面板 -->
    <div id="view-task" class="view">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold">我的任务</h2>
        <button id="addTaskBtn" class="px-4 py-2 bg-primary text-white rounded-lg"><i class="fa fa-plus mr-1"></i>新增任务</button>
      </div>
      <div id="taskList" class="space-y-2"></div>
      <div id="gameExpPanel" class="hidden mt-6 p-4 border border-primary rounded-lg bg-indigo-50 dark:bg-indigo-900/30">
        <div class="flex justify-between items-center">
          <span>🎮 游戏化进度 Lv.<span id="userLevel">1</span></span>
          <span>EXP: <span id="userExp">0</span>/<span id="expNeed">100</span></span>
        </div>
        <div class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full mt-2">
          <div id="expBar" class="h-2 bg-primary rounded-full w-0"></div>
        </div>
        <div class="mt-2 text-sm">当前职业：<span id="bindJob">未选择</span></div>
      </div>
    </div>

    <!-- 日历面板 -->
    <div id="view-calendar" class="view hidden">
      <h2 class="text-lg font-semibold mb-4">日历视图（拖拽格子创建任务）</h2>
      <div class="grid grid-cols-7 gap-1 text-center text-sm font-medium mb-2">
        <div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div>周六</div><div>周日</div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
    </div>

    <!-- 公开目标面板 -->
    <div id="view-publicGoal" class="view hidden">
      <h2 class="text-lg font-semibold mb-4">公开目标广场</h2>
      <div id="goalList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- 排行榜面板 -->
    <div id="view-rank" class="view hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold">赛道排行榜</h2>
        <select id="rankFilter" class="border rounded p-2 dark:bg-gray-700">
          <option value="all">全部赛道</option>
        </select>
      </div>
      <div id="rankList" class="space-y-2"></div>
      <div class="flex gap-2 mt-4" id="rankPageCtrl"></div>
    </div>
  </main>
</div>

<!-- 弹窗容器 -->
<div id="modalContainer"></div>
<div id="toastContainer"></div>

<script>
// ===================== 全局状态
const state = JSON.parse(localStorage.getItem("kuanxuState")) || {
  darkMode: false,
  gameOpen: false,
  level: 1,
  exp: 0,
  expTarget: 100,
  bindJob: null,
  lingxiaoChatStep: 0, // 0未开始，1~8轮问答，9问答完成
  lingxiaoAnswers: [],
  tasks: [],
  goals: [],
  ranks: [],
  calendarEvents: []
};

// 凌霄8轮固定问题
const lingxiaoQuestions = [
  "你更享受和人打交道，还是独自深度钻研？",
  "你希望工作产出偏向创意表达，还是稳定落地执行？",
  "你更看重自由弹性，还是清晰稳定的晋升路线？",
  "你希望你的成果可以影响更多大众，还是服务小众精准人群？",
  "遇到难题，你优先自己查资料试错，还是找人协作讨论？",
  "你是否愿意长期持续学习前沿新知识？",
  "你希望工作里有大量竞争对抗，还是平和长期深耕？",
  "一句话说说，你最理想的人生状态是什么？"
];

// 360职业精简池（这里放一批，你后续可以继续扩充到360条）
const jobPool = [
  {name:"教培老师",tag:"教育",desc:"擅长知识拆解、陪伴成长，输出课程与辅导，耐心引导他人进步"},
  {name:"产品经理",tag:"互联网",desc:"挖掘用户需求，设计方案，协调团队落地产品，平衡价值与体验"},
  {name:"独立设计师",tag:"创意",desc:"视觉、IP、空间创作，自由表达审美，产出打动人心的作品"},
  {name:"程序员",tag:"技术",desc:"用代码构建系统，解决复杂逻辑，持续迭代技术方案"},
  {name:"心理咨询师",tag:"健康",desc:"倾听情绪，疏导内耗，陪伴他人走出心理困境"},
  {name:"运营",tag:"互联网",desc:"连接用户，策划活动，持续放大内容与产品影响力"},
  {name:"医生",tag:"医疗",desc:"守护生命健康，诊断病症，严谨负责救死扶伤"},
  {name:"律师",tag:"法务",desc:"熟悉规则，捍卫权益，严谨梳理事实与证据"},
  {name:"自媒体博主",tag:"内容",desc:"持续输出观点内容，打造个人IP，传递价值"},
  {name:"科研研究员",tag:"学术",desc:"深耕细分领域，做实验、发论文，探索未知边界"},
  {name:"烘焙师",tag:"手工",desc:"把控食材与风味，用美食传递温暖，打磨稳定手艺"},
  {name:"策划",tag:"品牌",desc:"构思故事与方案，统筹活动，打造记忆点"},
  {name:"翻译",tag:"语言",desc:"跨语言传递信息，打通不同文化之间的沟通"},
  {name:"建筑师",tag:"工程",desc:"设计空间，兼顾美学、安全、实用，搭建人居环境"},
  {name:"摄影师",tag:"影像",desc:"捕捉瞬间，用光讲故事，记录与创作画面"}
];
// 自动补占位到360条，防止数量不对
while(jobPool.length < 360) {
  const idx = jobPool.length + 1;
  jobPool.push({name:`职业${idx}`,tag:"通用赛道",desc:`该职业画像待完善，完成目标持续解锁更多故事`})
}

// 模拟数据初始化
function initMockData(){
  if(state.tasks.length === 0) {
    state.tasks = [
      {id:1,title:"梳理产品PRD",done:false,exp:15,date:"2026-11-05"},
      {id:2,title:"复盘面试STAR案例",done:true,exp:20,date:"2026-11-05"},
      {id:3,title:"阅读行业报告",done:false,exp:10,date:"2026-11-06"},
      {id:4,title:"修改作品集文档",done:false,exp:25,date:"2026-11-07"},
    ]
  }
  if(state.goals.length ===0) {
    state.goals = [
      {id:1,title:"3个月拿下AIPM offer",author:"阿泽",like:124,desc:"每周投递8份简历，持续复盘面试"},
      {id:2,title:"半年稳定减重10斤",author:"小夏",like:89,desc:"规律运动+控糖，公开打卡监督自己"},
      {id:3,title:"读完20本专业书籍",author:"星野",like:56,desc:"每周固定6小时阅读，输出读书笔记"},
    ]
  }
  if(state.ranks.length ===0) {
    state.ranks = []
    const trackList = ["互联网产品","教育赛道","创意设计","技术开发","医疗健康"]
    for(let i=1;i<=42;i++){
      state.ranks.push({
        uid:i,
        name:"玩家"+i,
        track: trackList[i%trackList.length],
        score: Math.floor(Math.random()*8000)+1000,
        level: Math.floor(Math.random()*12)+1
      })
    }
  }
  if(state.calendarEvents.length ===0) {
    state.calendarEvents = [
      {title:"面试",date:"2026-11-06"},
      {title:"小组会议",date:"2026-11-08"},
      {title:"线下沙龙",date:"2026-11-10"},
    ]
  }
  saveState()
}

// 持久化
function saveState(){
  localStorage.setItem("kuanxuState", JSON.stringify(state))
}

// 弹窗工具
function openModal(title, html, onClose=null) {
  const container = document.getElementById("modalContainer")
  container.innerHTML = `
  <div class="modal-backdrop modal-root">
    <div class="modal-box">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg">${title}</h3>
        <button class="modal-close text-xl">&times;</button>
      </div>
      <div class="modal-body">${html}</div>
    </div>
  </div>
  `
  container.querySelector(".modal-close").onclick = ()=>{
    container.innerHTML = ""
    if(onClose) onClose()
  }
  container.querySelector(".modal-backdrop").onclick = (e)=>{
    if(e.target.classList.contains("modal-backdrop")) {
      container.innerHTML = ""
      if(onClose) onClose()
    }
  }
  bindModalEvents()
}
function closeModal(){document.getElementById("modalContainer").innerHTML=""}

// 成就弹窗
function showAchievement(text){
  const t = document.getElementById("toastContainer")
  const dom = document.createElement("div")
  dom.className = "achievement-toast px-4 py-3 bg-primary text-white rounded-lg shadow-lg"
  dom.innerHTML = `🏆 ${text}`
  t.appendChild(dom)
  setTimeout(()=>dom.remove(),1200)
}

// 升级动画
function triggerUpgrade(){
  showAchievement(`恭喜升级！Lv.${state.level}`)
  document.querySelector("#userLevel")?.classList.add("upgrade-flash")
  setTimeout(()=>document.querySelector("#userLevel")?.classList.remove("upgrade-flash"),1000)
}

// ========== 凌霄8轮问答逻辑
function startLingXiaoChat(){
  state.lingxiaoChatStep = 1
  state.lingxiaoAnswers = []
  saveState()
  renderLingXiaoStep()
}
function renderLingXiaoStep(){
  const step = state.lingxiaoChatStep
  if(step > 8) {
    // 8轮问答全部结束，进入职业选择面板
    openModal("凌霄AI｜问答完成，选择你的职业画像",`
      <p class="mb-3">已完成全部8轮对话，根据你的回答，你可以浏览360梯度职业，点击查看画像并绑定赛道</p>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-2 max-h-[60vh] overflow-y-auto pb-2" id="jobSelectWrap">
        ${jobPool.map((job,idx)=>`
          <div class="职业-card p-3 border rounded-lg dark:border-gray-600" data-jobidx="${idx}">
            <div class="font-medium">${job.name}</div>
            <div class="text-xs text-gray-500 dark:text-gray-400">${job.tag}</div>
            <div class="text-xs mt-1 line-clamp-2">${job.desc}</div>
          </div>
        `).join("")}
      </div>
    `)
    // 绑定职业点击事件
    setTimeout(()=>{
      document.querySelectorAll(".职业-card").forEach(card=>{
        card.onclick = ()=>{
          const idx = Number(card.dataset.jobidx)
          const job = jobPool[idx]
          openModal(`职业画像：${job.name}`,`
            <p class="text-sm text-gray-500 dark:text-gray-400">赛道标签：${job.tag}</p>
            <p class="my-3">${job.desc}</p>
            <button id="bindJobBtn" class="w-full py-2 bg-primary text-white rounded-lg mt-2">✅ 绑定该职业作为你的人生赛道</button>
          `)
          setTimeout(()=>{
            document.getElementById("bindJobBtn").onclick = ()=>{
              state.bindJob = job.name
              state.lingxiaoChatStep = 9
              saveState()
              closeModal()
              showAchievement(`成功绑定赛道：${job.name}`)
              renderAll()
            }
          },100)
        }
      })
    },100)
    return
  }
  // 当前第N轮提问
  const q = lingxiaoQuestions[step -1]
  openModal(`凌霄AI｜第${step}/8轮对话`,`
    <p class="mb-3">${q}</p>
    <textarea id="lingxiaoInput" class="w-full border rounded p-2 dark:bg-gray-700" rows="3" placeholder="写下你的想法..."></textarea>
    <button id="sendLingXiao" class="w-full py-2 bg-primary text-white rounded-lg mt-3">提交回答，进入下一轮</button>
  `)
  setTimeout(()=>{
    document.getElementById("sendLingXiao").onclick = ()=>{
      const val = document.getElementById("lingxiaoInput").value.trim()
      if(!val) return alert("请输入你的回答")
      state.lingxiaoAnswers.push(val)
      state.lingxiaoChatStep +=1
      saveState()
      renderLingXiaoStep()
    }
  },100)
}

// ========== 视图渲染
function renderTask(){
  const wrap = document.getElementById("taskList")
  wrap.innerHTML = ""
  state.tasks.forEach(t=>{
    const div = document.createElement("div")
    div.className = "flex items-center justify-between p-3 bg-white dark:bg-gray-800 rounded-lg shadow-sm"
    div.innerHTML = `
      <div class="flex items-center gap-2">
        <input type="checkbox" class="task-check w-4 h-4" data-id="${t.id}" ${t.done?"checked":""}>
        <span class="${t.done?"line-through text-gray-400":""}">${t.title}</span>
        ${state.gameOpen ? `<span class="text-xs text-primary">+${t.exp}EXP</span>` : ""}
      </div>
      <button class="delTask text-red-400" data-id="${t.id}"><i class="fa fa-trash"></i></button>
    `
    wrap.appendChild(div)
  })
  // 任务勾选
  document.querySelectorAll(".task-check").forEach(el=>el.onchange = (e)=>{
    const tid = Number(e.target.dataset.id)
    const t = state.tasks.find(x=>x.id===tid)
    if(!t) return
    const oldDone = t.done
    t.done = e.target.checked
    if(t.done && !oldDone && state.gameOpen){
      state.exp += t.exp
      // 升级判断
      while(state.exp >= state.expTarget) {
        state.exp -= state.expTarget
        state.level +=1
        state.expTarget = Math.floor(state.expTarget * 1.4)
        triggerUpgrade()
      }
    }
    saveState()
    renderAll()
  })
  // 删除任务
  document.querySelectorAll(".delTask").forEach(el=>el.onclick = (e)=>{
    const tid = Number(e.currentTarget.dataset.id)
    state.tasks = state.tasks.filter(x=>x.id!==tid)
    saveState()
    renderAll()
  })
  // 游戏面板
  const gamePanel = document.getElementById("gameExpPanel")
  if(state.gameOpen) {
    gamePanel.classList.remove("hidden")
    document.getElementById("userLevel").innerText = state.level
    document.getElementById("userExp").innerText = state.exp
    document.getElementById("expNeed").innerText = state.expTarget
    document.getElementById("expBar").style.width = `${state.exp/state.expTarget*100}%`
    document.getElementById("bindJob").innerText = state.bindJob || "未完成凌霄8轮问答"
  } else {
    gamePanel.classList.add("hidden")
  }
}

function renderCalendar(){
  const grid = document.getElementById("calendarGrid")
  grid.innerHTML = ""
  const today = new Date()
  const monthStart = new Date(today.getFullYear(), today.getMonth(),1)
  const startDay = monthStart.getDay() || 7
  const totalDays = new Date(today.getFullYear(), today.getMonth()+1,0).getDate()
  for(let i=1;i<startDay;i++){
    grid.innerHTML += `<div class="calendar-day border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50"></div>`
  }
  for(let d=1;d<=totalDays;d++){
    const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const events = state.calendarEvents.filter(e=>e.date === dateStr)
    const div = document.createElement("div")
    div.className = "calendar-day border border-gray-200 dark:border-gray-700 p-1 cursor-pointer hover:bg-indigo-50 dark:hover:bg-indigo-900/20"
    div.innerHTML = `<div class="text-sm">${d}</div>${events.map(e=>`<div class="text-xs bg-primary/20 rounded px-1 mt-0.5">${e.title}</div>`).join("")}`
    div.dataset.date = dateStr
    div.onclick = ()=>{
      openModal("新建日程",`
        <p>日期：${dateStr}</p>
        <input id="eventTitle" class="w-full border rounded p-2 mt-2 dark:bg-gray-700" placeholder="日程名称">
        <button id="saveEvent" class="w-full py-2 bg-primary text-white rounded-lg mt-3">保存日程</button>
      `)
      setTimeout(()=>{
        document.getElementById("saveEvent").onclick = ()=>{
          const title = document.getElementById("eventTitle").value.trim()
          if(!title) return
          state.calendarEvents.push({title,date:dateStr})
          saveState()
          closeModal()
          renderAll()
        }
      },100)
    }
    grid.appendChild(div)
  }
}

function renderGoals(){
  const wrap = document.getElementById("goalList")
  wrap.innerHTML = ""
  state.goals.forEach(g=>{
    wrap.innerHTML += `
    <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow-sm">
      <div class="font-medium">${g.title}</div>
      <div class="text-xs text-gray-400">@${g.author}</div>
      <p class="text-sm mt-2">${g.desc}</p>
      <div class="mt-2 text-sm text-rose-400"><i class="fa fa-heart"></i> ${g.like}</div>
    </div>
    `
  })
}

let rankPage = 1
const rankPageSize = 10
function renderRank(){
  const filterVal = document.getElementById("rankFilter").value
  let list = [...state.ranks]
  if(filterVal !== "all") list = list.filter(x=>x.track === filterVal)
  list.sort((a,b)=>b.score - a.score)
  const totalPage = Math.ceil(list.length / rankPageSize)
  const start = (rankPage-1)*rankPageSize
  const pageData = list.slice(start, start+rankPageSize)
  const wrap = document.getElementById("rankList")
  wrap.innerHTML = ""
  pageData.forEach((item,idx)=>{
    wrap.innerHTML += `
      <div class="flex items-center justify-between p-3 bg-white dark:bg-gray-800 rounded-lg">
        <div class="flex gap-3 items-center">
          <span class="w-6 h-6 rounded-full bg-primary text-white text-center text-sm">${start+idx+1}</span>
          <span>${item.name}</span>
          <span class="text-xs text-gray-400">${item.track}</span>
        </div>
        <span>Lv.${item.level}｜${item.score}分</span>
      </div>
    `
  })
  // 分页控件
  const pageCtrl = document.getElementById("rankPageCtrl")
  pageCtrl.innerHTML = `
    <button id="prevPage" class="px-3 py-1 border rounded ${rankPage<=1?'opacity-40 cursor-not-allowed':''}">上一页</button>
    <span>第${rankPage}/${totalPage}页</span>
    <button id="nextPage" class="px-3 py-1 border rounded ${rankPage>=totalPage?'opacity-40 cursor-not-allowed':''}">下一页</button>
  `
  document.getElementById("prevPage").onclick = ()=>{
    if(rankPage>1){rankPage--;renderRank()}
  }
  document.getElementById("nextPage").onclick = ()=>{
    if(rankPage<totalPage){rankPage++;renderRank()}
  }
  // 赛道下拉
  const tracks = [...new Set(state.ranks.map(x=>x.track))]
  document.getElementById("rankFilter").innerHTML = `<option value="all">全部赛道</option>` + tracks.map(t=>`<option value="${t}">${t}</option>`).join("")
  document.getElementById("rankFilter").value = filterVal
  document.getElementById("rankFilter").onchange = ()=>{rankPage=1;renderRank()}
}

// 切换视图
function bindViewSwitch(){
  document.querySelectorAll(".view-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const target = btn.dataset.view
      document.querySelectorAll(".view").forEach(v=>v.classList.add("hidden"))
      document.getElementById(`view-${target}`).classList.remove("hidden")
    }
  })
}

// 绑定所有全局按钮
function bindGlobalButtons(){
  // 深色模式
  document.getElementById("toggleDark").onclick = ()=>{
    state.darkMode = !state.darkMode
    if(state.darkMode) document.documentElement.classList.add("dark")
    else document.documentElement.classList.remove("dark")
    saveState()
    renderAll()
  }
  // 游戏化入口
  document.getElementById("gameToggle").onclick = ()=>{
    openModal("宽序 · 游戏化人生系统",`
      <div class="space-y-3">
        <p>欢迎来到宽序人生赛道，和凌霄AI完成8轮对话，定位你的人生向往方向。</p>
        <p>当前等级：Lv.${state.level}｜EXP：${state.exp}/${state.expTarget}</p>
        <p>360梯度职业池，自由查看职业画像，绑定专属赛道。</p>
        ${state.lingxiaoChatStep >=9 ? `<p class="text-green-500">✅ 已完成问答，绑定赛道：${state.bindJob}</p>`:"<p>🔒 暂未完成凌霄8轮问答</p>"}
        <button id="startChatBtn" class="w-full py-2 bg-primary text-white rounded-lg">开始凌霄8轮问答</button>
        <label class="flex items-center gap-2 mt-2">
          <input type="checkbox" id="gameSwitch" ${state.gameOpen?"checked":""}>
          <span>开启任务EXP、升级游戏化</span>
        </label>
      </div>
    `)
    setTimeout(()=>{
      document.getElementById("startChatBtn").onclick = ()=>{
        closeModal()
        startLingXiaoChat()
      }
      document.getElementById("gameSwitch").onchange = (e)=>{
        state.gameOpen = e.target.checked
        saveState()
        renderAll()
      }
    },100)
  }
  // 新增任务
  document.getElementById("addTaskBtn").onclick = ()=>{
    openModal("新增任务",`
      <input id="newTaskTitle" class="w-full border rounded p-2 dark:bg-gray-700" placeholder="任务名称">
      ${state.gameOpen?`<input id="newTaskExp" class="w-full border rounded p-2 mt-2 dark:bg-gray-700" placeholder="EXP奖励，如15" value="10">`:""}
      <button id="saveNewTask" class="w-full py-2 bg-primary text-white rounded-lg mt-3">保存</button>
    `)
    setTimeout(()=>{
      document.getElementById("saveNewTask").onclick = ()=>{
        const title = document.getElementById("newTaskTitle").value.trim()
        if(!title) return alert("任务名不能为空")
        const exp = state.gameOpen ? Number(document.getElementById("newTaskExp").value) || 10 : 0
        state.tasks.push({
          id: Date.now(),
          title,
          done: false,
          exp,
          date: new Date().toISOString().slice(0,10)
        })
        saveState()
        closeModal()
        renderAll()
      }
    },100)
  }
}
function bindModalEvents(){}
function renderAll(){
  renderTask()
  renderCalendar()
  renderGoals()
  renderRank()
}

// 初始化入口
function bootstrap(){
  if(state.darkMode) document.documentElement.classList.add("dark")
  initMockData()
  bindViewSwitch()
  bindGlobalButtons()
  renderAll()
}
bootstrap()
</script>
</body>
</html>
